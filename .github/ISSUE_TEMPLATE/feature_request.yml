name: Feature request
description: Suggest a new rule, setting or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that pr-trust doesn't support?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working, including example configuration if it helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
