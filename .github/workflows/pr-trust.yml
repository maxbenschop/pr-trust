# This repository's own contributor check, using the Action as of the default branch.
name: Contributor trust

on:
  pull_request_target: # runs from the default branch; never checks out PR code
    types: [opened, reopened]
  issue_comment: # a maintainer's "/vouch" adds the author to .github/VOUCHED.td
    types: [created]
  push: # the trust list changed: check open "trust: unknown" pull requests again
    branches: [main]
    paths: [.github/VOUCHED.td]
  workflow_dispatch: # re-run by hand, e.g. after vouching for someone
    inputs:
      pr-number:
        description: Pull request to check
        required: true
      as-author:
        description: Optional. Check it as if this username had opened it (to try out the rules)
        required: false
        default: ""
      dry-run:
        description: Report only, change nothing
        type: boolean
        default: false

permissions:
  contents: write # /vouch commits to .github/VOUCHED.td (or a pr-trust/vouch-* branch); nothing else is written
  pull-requests: write # labels and comments; /vouch opens a pull request if main only takes pull requests
  issues: write # create the trust labels; reply to and react on /vouch comments

concurrency:
  # Each comment gets its own group, so a busy discussion never cancels a pending check.
  # Pushes share one group: a newer pending push replaces an older one, which is fine,
  # since it checks against the newer list.
  group: pr-trust-${{ github.event_name == 'issue_comment' && format('comment-{0}', github.event.comment.id) || github.event_name == 'push' && 'list-changed' || github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

jobs:
  check:
    # Most comments are not commands; skip those without starting a runner.
    if: github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/vouch')
    runs-on: ubuntu-latest
    steps:
      # Checks out the default branch, never the pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          pr-number: ${{ inputs.pr-number }}
          as-author: ${{ inputs.as-author }}
          dry-run: ${{ inputs.dry-run || false }}
