# This repository's own contributor check, using the Action as of the default branch.
name: Contributor trust

on:
  pull_request_target: # runs from the default branch; never checks out PR code
    types: [opened, reopened]
  workflow_dispatch: # re-run by hand, e.g. after vouching for someone
    inputs:
      pr-number:
        description: Pull request to check
        required: true
      as-author:
        description: Optional. Check it as if this username had opened it (to try out the rules)
        required: false
        default: ""
      dry-run:
        description: Report only, change nothing
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write # create the trust labels the first time they are used

concurrency:
  group: pr-trust-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Checks out the default branch, never the pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          pr-number: ${{ inputs.pr-number }}
          as-author: ${{ inputs.as-author }}
          dry-run: ${{ inputs.dry-run || false }}
