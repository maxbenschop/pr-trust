name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the documentation pages (fails on a broken link)
        run: pnpm build:docs
      - run: pnpm build
      - name: Check that dist/ matches the source
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date. Run pnpm build and commit the result."
            exit 1
          fi

  # Runs the Action from this checkout on the pull request itself, without changing it.
  dry-run:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: trust
        uses: ./
        with:
          dry-run: "true"
          fail-on-error: "true"
      - run: echo "Result was ${{ steps.trust.outputs.status }}"
      # The pull request's version of this repository's rules, as examples/validate-rules.yml does.
      - uses: ./
        with:
          validate: .github/trust.yml
