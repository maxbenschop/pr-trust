# .github/workflows/pr-trust.yml
name: Contributor trust

on:
  pull_request_target: # runs with write access even for PRs from forks; never checks out PR code
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pin to a release commit; replace the hash with the release you use.
      - uses: maxbenschop/pr-trust@00e722ff4f51d4bdf2b1ed89316b741ef5cf0ac6 # v0.1.1
