name: PR Trust
description: Check pull request authors against contributor-trust rules, with Vouch list support, a /vouch comment command and re-checks when the list changes.
author: maxbenschop
branding:
  icon: check-square
  color: green

inputs:
  github-token:
    description: >-
      Token used to read rules and trust lists and to label, comment on and close the PR. For
      the /vouch command (issue_comment events) it also needs contents: write; on a default
      branch that only takes pull requests, /vouch opens one, which also needs the repository
      setting "Allow GitHub Actions to create and approve pull requests".
    default: ${{ github.token }}
  config:
    description: Path of the rules file, read from the default branch.
    default: .github/trust.yml
  dry-run:
    description: Decide and report, but change nothing on the pull request (or, for /vouch, in the trust list).
    default: "false"
  pr-number:
    description: Check this pull request instead of the one in the triggering event.
    default: ""
  as-author:
    description: >-
      For trying out rules: check the pull request as if this GitHub username had opened it as an
      outside contributor. Labels and comments are applied unless dry-run is on. Leave empty in
      normal use.
    default: ""
  fail-on-error:
    description: Fail the job when the check itself fails. The PR is never closed on an error either way.
    default: "false"

outputs:
  status:
    description: >-
      admitted, exempt, unknown, denounced, skipped (maintainer, bot or closed PR) or error. On a
      comment: the result of checking the PR again after /vouch, else skipped (or error if
      /vouch failed). On a push: skipped.
  admitted:
    description: '"true" when the author may proceed (admitted, exempt or skipped).'
  reason:
    description: One line explaining the result.
  rule:
    description: The rule that admitted the author, if any.
  command:
    description: >-
      On a comment: vouched, already-vouched, proposed (a pull request adding the account is
      open), refused or failed for a /vouch command from a maintainer; empty for any other
      comment.
  rechecked:
    description: >-
      On a push to the default branch that changed the project's own list: the numbers of the
      open "unknown" pull requests checked again, comma-separated.

runs:
  using: node24
  main: dist/index.cjs
